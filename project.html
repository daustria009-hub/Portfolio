<!doctype html>
<html lang="en">
<head>

  <!-- EDIT: the letter in the tab icon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2300a84f'/><text x='50' y='72' font-family='sans-serif' font-size='62' font-weight='700' fill='white' text-anchor='middle'>D</text></svg>">
  <!-- Applies the saved light/dark choice before the page is painted, so there
       is no flash of the wrong colors. The toggle itself lives in script.js. -->
  <script>
    try {
      var t = localStorage.getItem("theme");
      if (t) document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
